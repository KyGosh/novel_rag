[project]
name = "novel-rag"
version = "0.7.0"
description = "长篇小说跨章节问答 Agent：混合检索 + 知识图谱工具 + LangGraph 多轮检索规划，附可复现的评测与消融"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "elasticsearch>=8.19,<8.20",
    "pymilvus>=2.6,<2.7",
    "neo4j>=5.28",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "openai>=1.60",
    "numpy>=1.26",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "rapidfuzz>=3.14.6",
    "langgraph==1.2.20",  # 锁定版本：只用 StateGraph + 条件边（P4）
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
# 本地 GPU 模型（bge-m3、bge-reranker）。默认安装；CI 跑单测时不装（单测不依赖 GPU 库）
gpu = [
    "torch==2.14.1",
    "FlagEmbedding>=1.4",
]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_rag"]

# torch 必须从 PyTorch 官方 CUDA 索引安装，否则 Windows 上会装成 CPU 版
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: 需要 docker 服务、GPU 或可用的 LLM 接口"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
